[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "canopyledger"
version = "0.1.0"
description = "Evidence-adjusted borrowing-base decisioning for coffee trade finance"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
canopyledger-replay = "canopyledger.cli.replay:main"

[project.optional-dependencies]
dev = [
  "httpx2>=2.4,<3",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/canopyledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["canopyledger"]
mypy_path = "src"
