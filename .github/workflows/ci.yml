name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/export_openapi.py --check
      - run: npm ci
        working-directory: typescript
      - run: npm test
        working-directory: typescript
      - run: npm run typecheck
        working-directory: typescript
      - run: npm run client:check
        working-directory: typescript
      - run: uv run pytest --cov=canopyledger --cov-report=xml

  database-roles:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: canopyledger-test
          POSTGRES_DB: canopyledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d canopyledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: uv sync --locked --extra dev
      - run: bash tests/integration/test_database_roles.sh
        env:
          DATABASE_URL: postgresql://postgres:canopyledger-test@localhost:5432/canopyledger
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postgres:canopyledger-test@localhost:5432/canopyledger
      - run: uv run alembic check
        env:
          DATABASE_URL: postgresql+psycopg://postgres:canopyledger-test@localhost:5432/canopyledger
      - run: uv run pytest -m postgres -q
        env:
          DATABASE_URL: postgresql+psycopg://postgres:canopyledger-test@localhost:5432/canopyledger

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never

  quality-gate:
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
