name: Bug report
description: Report a reproducible problem in the synthetic reference application.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, real financial data, documents, geolocation, or vulnerability details.
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your OS, Python version, Node.js version, and the command you ran.
